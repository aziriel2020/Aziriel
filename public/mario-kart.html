<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mario Kart Racing Game</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial Black', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #gameContainer {
      position: relative;
      background: #000;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }

    #gameCanvas {
      display: block;
      background: #2d5016;
    }

    #ui {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 20px;
      color: white;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
      pointer-events: none;
    }

    .ui-panel {
      background: rgba(0, 0, 0, 0.7);
      border-radius: 10px;
      padding: 10px 15px;
      margin-bottom: 10px;
      border: 2px solid #FFD700;
    }

    #position {
      font-size: 48px;
      color: #FFD700;
      text-align: center;
      margin-bottom: 10px;
    }

    #lapCounter {
      font-size: 24px;
      text-align: center;
    }

    #speedometer {
      font-size: 20px;
      margin-top: 5px;
    }

    #items {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 10px;
    }

    .item-slot {
      width: 50px;
      height: 50px;
      background: rgba(255, 255, 255, 0.2);
      border: 3px solid #FFD700;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
    }

    #minimap {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 150px;
      height: 150px;
      background: rgba(0, 0, 0, 0.8);
      border: 3px solid #FFD700;
      border-radius: 10px;
    }

    #startScreen, #gameOverScreen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      z-index: 100;
    }

    .hidden {
      display: none !important;
    }

    h1 {
      font-size: 60px;
      color: #FFD700;
      margin-bottom: 20px;
      text-shadow: 4px 4px 8px rgba(0, 0, 0, 0.8);
    }

    button {
      font-family: 'Arial Black', Arial, sans-serif;
      font-size: 24px;
      padding: 15px 40px;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      transition: transform 0.2s;
      pointer-events: all;
    }

    button:hover {
      transform: scale(1.1);
    }

    .controls {
      margin: 20px 0;
      text-align: center;
      font-size: 18px;
      line-height: 1.6;
    }

    .controls div {
      margin: 5px 0;
    }

    #countdown {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 120px;
      color: #FFD700;
      text-shadow: 4px 4px 8px rgba(0, 0, 0, 0.8);
      z-index: 50;
      animation: pulse 1s ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.2); }
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas" width="1000" height="700"></canvas>
    <canvas id="minimap" width="150" height="150"></canvas>

    <div id="ui">
      <div class="ui-panel">
        <div id="position">1st</div>
        <div id="lapCounter">Lap: 1/3</div>
        <div id="speedometer">Speed: 0 km/h</div>
      </div>
      <div id="items"></div>
    </div>

    <div id="startScreen">
      <h1>🏎️ MARIO KART RACING 🏎️</h1>
      <div class="controls">
        <div><strong>⬆️ Arrow Up:</strong> Accelerate</div>
        <div><strong>⬇️ Arrow Down:</strong> Brake</div>
        <div><strong>⬅️➡️ Arrow Left/Right:</strong> Steer</div>
        <div><strong>SPACE:</strong> Use Item</div>
        <div style="margin-top: 20px; color: #FFD700;">🎯 Race 3 laps and finish first!</div>
      </div>
      <button onclick="startGame()">START RACE</button>
    </div>

    <div id="gameOverScreen" class="hidden">
      <h1 id="finalPosition"></h1>
      <div style="font-size: 30px; margin: 20px 0;" id="finalTime"></div>
      <button onclick="restartGame()">RACE AGAIN</button>
    </div>

    <div id="countdown" class="hidden"></div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const minimap = document.getElementById('minimap');
    const minimapCtx = minimap.getContext('2d');

    // Game state
    let gameState = 'menu'; // menu, countdown, playing, finished
    let countdownValue = 3;
    let raceStartTime = 0;
    let raceFinishTime = 0;

    // Track configuration
    const track = {
      centerX: canvas.width / 2,
      centerY: canvas.height / 2,
      outerRadius: 280,
      innerRadius: 180,
      checkpoints: []
    };

    // Initialize checkpoints for lap counting
    for (let i = 0; i < 8; i++) {
      const angle = (i / 8) * Math.PI * 2;
      track.checkpoints.push({
        angle: angle,
        x: track.centerX + Math.cos(angle) * ((track.outerRadius + track.innerRadius) / 2),
        y: track.centerY + Math.sin(angle) * ((track.outerRadius + track.innerRadius) / 2)
      });
    }

    // Kart class
    class Kart {
      constructor(color, name, isPlayer = false) {
        this.color = color;
        this.name = name;
        this.isPlayer = isPlayer;

        // Position on track (angle in radians)
        this.angle = -Math.PI / 2;
        this.radius = (track.outerRadius + track.innerRadius) / 2;

        // Physics
        this.speed = 0;
        this.maxSpeed = isPlayer ? 5 : 4.5;
        this.acceleration = 0.15;
        this.friction = 0.95;
        this.turnSpeed = 0.03;

        // Racing stats
        this.lap = 1;
        this.checkpointIndex = 0;
        this.totalDistance = 0;
        this.finished = false;
        this.finishTime = 0;

        // Items
        this.item = null;
        this.itemCooldown = 0;

        // AI
        this.aiTargetRadius = this.radius + (Math.random() - 0.5) * 40;
        this.aiAggressiveness = 0.5 + Math.random() * 0.5;
      }

      get x() {
        return track.centerX + Math.cos(this.angle) * this.radius;
      }

      get y() {
        return track.centerY + Math.sin(this.angle) * this.radius;
      }

      update(keys) {
        if (this.finished) return;

        if (this.isPlayer && gameState === 'playing') {
          // Player controls
          if (keys.ArrowUp) {
            this.speed += this.acceleration;
          }
          if (keys.ArrowDown) {
            this.speed -= this.acceleration * 0.7;
          }
          if (keys.ArrowLeft) {
            this.angle -= this.turnSpeed * Math.max(0.3, this.speed / this.maxSpeed);
          }
          if (keys.ArrowRight) {
            this.angle += this.turnSpeed * Math.max(0.3, this.speed / this.maxSpeed);
          }
          if (keys[' '] && this.item && this.itemCooldown <= 0) {
            this.useItem();
          }
        } else if (!this.isPlayer && gameState === 'playing') {
          // AI controls
          this.speed += this.acceleration * this.aiAggressiveness;

          // AI steering
          const targetAngle = this.angle + 0.02;
          this.angle = targetAngle;

          // Adjust radius to stay on track
          if (this.radius < this.aiTargetRadius) {
            this.radius += 0.5;
          } else if (this.radius > this.aiTargetRadius) {
            this.radius -= 0.5;
          }
        }

        // Apply friction
        this.speed *= this.friction;

        // Limit speed
        this.speed = Math.max(-this.maxSpeed * 0.5, Math.min(this.maxSpeed, this.speed));

        // Move forward
        if (gameState === 'playing') {
          this.angle += (this.speed / this.radius) * 0.5;
          this.totalDistance += Math.abs(this.speed);
        }

        // Keep on track
        if (this.radius < track.innerRadius + 10) {
          this.radius = track.innerRadius + 10;
          this.speed *= 0.7;
        }
        if (this.radius > track.outerRadius - 10) {
          this.radius = track.outerRadius - 10;
          this.speed *= 0.7;
        }

        // Check for checkpoint
        this.checkCheckpoint();

        // Item cooldown
        if (this.itemCooldown > 0) {
          this.itemCooldown--;
        }

        // Random item pickup
        if (!this.item && Math.random() < 0.002 && gameState === 'playing') {
          this.pickupItem();
        }
      }

      checkCheckpoint() {
        const nextCheckpoint = track.checkpoints[this.checkpointIndex];
        const dx = this.x - nextCheckpoint.x;
        const dy = this.y - nextCheckpoint.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < 50) {
          this.checkpointIndex++;
          if (this.checkpointIndex >= track.checkpoints.length) {
            this.checkpointIndex = 0;
            this.lap++;
            if (this.lap > 3 && !this.finished) {
              this.finished = true;
              this.finishTime = Date.now() - raceStartTime;
              if (this.isPlayer) {
                endRace();
              }
            }
          }
        }
      }

      pickupItem() {
        const items = ['🚀', '🐢', '🍌', '⭐'];
        this.item = items[Math.floor(Math.random() * items.length)];
        if (this.isPlayer) {
          updateItemsUI();
        }
      }

      useItem() {
        if (!this.item) return;

        switch (this.item) {
          case '🚀': // Speed boost
            this.speed = this.maxSpeed * 1.5;
            break;
          case '🐢': // Shell (slow others)
            karts.forEach(k => {
              if (k !== this && !k.finished) {
                const dx = k.x - this.x;
                const dy = k.y - this.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 100) {
                  k.speed *= 0.3;
                }
              }
            });
            break;
          case '🍌': // Banana (place obstacle)
            // Simplified - just slow down nearby karts
            break;
          case '⭐': // Star (invincibility + speed)
            this.speed = this.maxSpeed * 1.8;
            this.maxSpeed *= 1.2;
            setTimeout(() => {
              this.maxSpeed /= 1.2;
            }, 3000);
            break;
        }

        this.item = null;
        this.itemCooldown = 180;
        if (this.isPlayer) {
          updateItemsUI();
        }
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle + Math.PI / 2);

        // Kart body
        ctx.fillStyle = this.color;
        ctx.fillRect(-12, -16, 24, 32);

        // Kart details
        ctx.fillStyle = '#333';
        ctx.fillRect(-10, -12, 20, 8);

        // Wheels
        ctx.fillStyle = '#000';
        ctx.fillRect(-14, -10, 4, 8);
        ctx.fillRect(10, -10, 4, 8);
        ctx.fillRect(-14, 2, 4, 8);
        ctx.fillRect(10, 2, 4, 8);

        // Driver head
        ctx.fillStyle = '#FFD1A4';
        ctx.beginPath();
        ctx.arc(0, -8, 6, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();

        // Draw on minimap
        const mmScale = 0.5;
        const mmX = 75 + Math.cos(this.angle) * this.radius * mmScale;
        const mmY = 75 + Math.sin(this.angle) * this.radius * mmScale;
        minimapCtx.fillStyle = this.color;
        minimapCtx.beginPath();
        minimapCtx.arc(mmX, mmY, this.isPlayer ? 4 : 3, 0, Math.PI * 2);
        minimapCtx.fill();
      }
    }

    // Create karts
    const karts = [
      new Kart('#FF0000', 'Mario', true),
      new Kart('#00FF00', 'Luigi'),
      new Kart('#FFFF00', 'Peach'),
      new Kart('#0000FF', 'Toad'),
      new Kart('#FF00FF', 'Yoshi'),
      new Kart('#00FFFF', 'Bowser'),
      new Kart('#FFA500', 'Donkey Kong'),
      new Kart('#800080', 'Wario')
    ];

    // Spread karts at start
    karts.forEach((kart, i) => {
      kart.angle = -Math.PI / 2 - (i * 0.05);
    });

    const player = karts[0];

    // Keyboard input
    const keys = {};
    window.addEventListener('keydown', (e) => {
      keys[e.key] = true;
      if (e.key === ' ') e.preventDefault();
    });
    window.addEventListener('keyup', (e) => {
      keys[e.key] = false;
    });

    // Draw track
    function drawTrack() {
      // Grass
      ctx.fillStyle = '#2d5016';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Outer edge
      ctx.fillStyle = '#8B4513';
      ctx.beginPath();
      ctx.arc(track.centerX, track.centerY, track.outerRadius + 15, 0, Math.PI * 2);
      ctx.fill();

      // Track
      ctx.fillStyle = '#505050';
      ctx.beginPath();
      ctx.arc(track.centerX, track.centerY, track.outerRadius, 0, Math.PI * 2);
      ctx.fill();

      // Inner grass
      ctx.fillStyle = '#2d5016';
      ctx.beginPath();
      ctx.arc(track.centerX, track.centerY, track.innerRadius, 0, Math.PI * 2);
      ctx.fill();

      // Inner edge
      ctx.fillStyle = '#8B4513';
      ctx.beginPath();
      ctx.arc(track.centerX, track.centerY, track.innerRadius - 15, 0, Math.PI * 2);
      ctx.fill();

      // Track lines
      ctx.strokeStyle = '#FFFFFF';
      ctx.lineWidth = 3;
      ctx.setLineDash([20, 20]);
      ctx.beginPath();
      ctx.arc(track.centerX, track.centerY, (track.outerRadius + track.innerRadius) / 2, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);

      // Start/Finish line
      ctx.fillStyle = '#FFFFFF';
      for (let i = 0; i < 10; i++) {
        const angle = -Math.PI / 2;
        const r = track.innerRadius + (i / 10) * (track.outerRadius - track.innerRadius);
        const x = track.centerX + Math.cos(angle) * r;
        const y = track.centerY + Math.sin(angle) * r;
        ctx.fillStyle = i % 2 === 0 ? '#FFFFFF' : '#000000';
        ctx.fillRect(x - 3, y - 15, 6, 30);
      }

      // Draw minimap
      minimapCtx.fillStyle = '#2d5016';
      minimapCtx.fillRect(0, 0, 150, 150);

      minimapCtx.strokeStyle = '#505050';
      minimapCtx.lineWidth = 15;
      minimapCtx.beginPath();
      minimapCtx.arc(75, 75, track.outerRadius * 0.5, 0, Math.PI * 2);
      minimapCtx.stroke();

      minimapCtx.lineWidth = 10;
      minimapCtx.beginPath();
      minimapCtx.arc(75, 75, track.innerRadius * 0.5, 0, Math.PI * 2);
      minimapCtx.stroke();
    }

    // Update UI
    function updateUI() {
      // Calculate positions
      const sortedKarts = [...karts].sort((a, b) => {
        if (a.lap !== b.lap) return b.lap - a.lap;
        return b.totalDistance - a.totalDistance;
      });

      const playerPosition = sortedKarts.indexOf(player) + 1;
      const suffix = ['st', 'nd', 'rd', 'th', 'th', 'th', 'th', 'th'];
      document.getElementById('position').textContent = playerPosition + suffix[playerPosition - 1];

      document.getElementById('lapCounter').textContent = `Lap: ${Math.min(player.lap, 3)}/3`;
      document.getElementById('speedometer').textContent = `Speed: ${Math.round(Math.abs(player.speed) * 20)} km/h`;
    }

    function updateItemsUI() {
      const itemsDiv = document.getElementById('items');
      itemsDiv.innerHTML = '';

      if (player.item) {
        const slot = document.createElement('div');
        slot.className = 'item-slot';
        slot.textContent = player.item;
        itemsDiv.appendChild(slot);
      }
    }

    // Game loop
    function gameLoop() {
      drawTrack();

      // Update and draw karts
      karts.forEach(kart => kart.update(keys));

      // Sort karts by distance for proper drawing order
      const sortedKarts = [...karts].sort((a, b) => a.y - b.y);
      sortedKarts.forEach(kart => kart.draw());

      if (gameState === 'playing') {
        updateUI();
      }

      requestAnimationFrame(gameLoop);
    }

    // Start game
    function startGame() {
      document.getElementById('startScreen').classList.add('hidden');
      gameState = 'countdown';

      const countdownEl = document.getElementById('countdown');
      countdownEl.classList.remove('hidden');

      let count = 3;
      countdownEl.textContent = count;

      const countdownInterval = setInterval(() => {
        count--;
        if (count > 0) {
          countdownEl.textContent = count;
        } else if (count === 0) {
          countdownEl.textContent = 'GO!';
        } else {
          countdownEl.classList.add('hidden');
          gameState = 'playing';
          raceStartTime = Date.now();
          clearInterval(countdownInterval);
        }
      }, 1000);
    }

    // End race
    function endRace() {
      gameState = 'finished';

      const sortedKarts = [...karts].filter(k => k.finished).sort((a, b) => a.finishTime - b.finishTime);
      const playerPosition = sortedKarts.indexOf(player) + 1;

      const suffix = ['st', 'nd', 'rd', 'th', 'th', 'th', 'th', 'th'];
      document.getElementById('finalPosition').textContent =
        `${playerPosition}${suffix[playerPosition - 1]} Place!`;

      const time = (player.finishTime / 1000).toFixed(2);
      document.getElementById('finalTime').textContent = `Time: ${time}s`;

      document.getElementById('gameOverScreen').classList.remove('hidden');
    }

    // Restart game
    function restartGame() {
      document.getElementById('gameOverScreen').classList.add('hidden');

      // Reset all karts
      karts.forEach((kart, i) => {
        kart.angle = -Math.PI / 2 - (i * 0.05);
        kart.radius = (track.outerRadius + track.innerRadius) / 2;
        kart.speed = 0;
        kart.lap = 1;
        kart.checkpointIndex = 0;
        kart.totalDistance = 0;
        kart.finished = false;
        kart.finishTime = 0;
        kart.item = null;
        kart.itemCooldown = 0;
      });

      startGame();
    }

    // Start game loop
    gameLoop();
  </script>
</body>
</html>
