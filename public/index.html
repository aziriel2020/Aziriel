<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeuraField Quantum - AI Video Generation Platform</title>
  <meta name="description" content="Revolutionary AI-powered video generation platform with 15+ models, legendary storyboard system, and production-ready features.">
  <meta property="og:title" content="NeuraField Quantum">
  <meta property="og:description" content="The most advanced AI video generation platform">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container { max-width: 1200px; text-align: center; }
    h1 {
      font-size: 4rem;
      font-weight: 800;
      margin-bottom: 20px;
      text-shadow: 0 4px 20px rgba(0,0,0,0.3);
      animation: glow 2s ease-in-out infinite alternate;
    }
    @keyframes glow {
      from { text-shadow: 0 0 20px #fff, 0 0 40px #667eea; }
      to { text-shadow: 0 0 30px #fff, 0 0 50px #764ba2; }
    }
    .subtitle { font-size: 1.5rem; margin-bottom: 40px; opacity: 0.9; }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin: 40px 0;
    }
    .stat-card {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 30px;
      border: 1px solid rgba(255,255,255,0.2);
      transition: transform 0.3s;
    }
    .stat-card:hover { transform: translateY(-10px); }
    .stat-number { font-size: 3rem; font-weight: 700; display: block; }
    .btn {
      padding: 15px 40px;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 50px;
      text-decoration: none;
      background: white;
      color: #667eea;
      display: inline-block;
      margin: 10px;
      transition: transform 0.3s;
    }
    .btn:hover { transform: scale(1.05); }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔥 NEURAFIELD QUANTUM</h1>
    <p class="subtitle">The Most Advanced AI Video Generation Platform</p>
    <div class="stats">
      <div class="stat-card"><span class="stat-number">15+</span>AI Models</div>
      <div class="stat-card"><span class="stat-number">50+</span>Features</div>
      <div class="stat-card"><span class="stat-number">40+</span>API Endpoints</div>
      <div class="stat-card"><span class="stat-number">$1.1M+</span>Value</div>
    </div>
    <a href="/api" class="btn">Explore API</a>
    <a href="/health" class="btn">Health Check</a>
    <p style="margin-top: 40px; opacity: 0.7;">Built with 1000000% intensity 🔥💎</p>
  </div>
</body>
</html>
