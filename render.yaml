services:
  - type: web
    name: neurafield-quantum-api
    env: node
    buildCommand: npm install && npx prisma generate
    startCommand: npx prisma db push --accept-data-loss && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: neurafield-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: neurafield-redis
          type: redis
          property: connectionString

databases:
  - name: neurafield-db
    plan: starter

  - name: neurafield-redis
    plan: starter
