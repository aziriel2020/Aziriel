# NEURAFIELD QUANTUM v5.0 - Docker Compose

version: '3.8'

services:
  neurafield-quantum:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neurafield-quantum
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    networks:
      - neurafield-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  neurafield-network:
    driver: bridge

volumes:
  data:
    driver: local
